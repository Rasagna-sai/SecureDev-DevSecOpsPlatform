
services:
  backend:
    build:
      context: ./backend/securedev-backend
      dockerfile: Dockerfile
    container_name: securedev-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securedev
      SPRING_DATASOURCE_USERNAME: securedev
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: securedev-postgres
    environment:
      POSTGRES_DB: securedev
      POSTGRES_USER: securedev
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - securedev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedev -d securedev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  securedev-data:
